              sys.exit(
                  "checksums.txt disagrees with the signed manifest — "
                  f"only in checksums.txt: {only_listed}; "
                  f"only in manifest: {only_signed}; "
                  f"hash mismatch: {mismatched}"
              )
          print(f"checksums.txt agrees with the signed manifest across {len(signed)} assets")
          PY

      - name: Create release
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          # Re-check immediately before create: a concurrent run may have
          # published between validate and now. As in validate, a non-404 error
          # must not be read as "no such release".
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}")"
          case "$status" in
            404) ;;
            200)
              echo "::error::release v${VERSION} appeared on ${GITHUB_REPOSITORY} while this run was in flight — refusing to overwrite"
              exit 1
              ;;
            *)
              echo "::error::could not confirm release v${VERSION} is absent from ${GITHUB_REPOSITORY} (HTTP ${status}) — refusing to publish"
              exit 1
              ;;
          esac
          gh release create "v${VERSION}" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Breeze ${VERSION} (self-signed)" \
            --notes "Breeze ${VERSION} agent packages signed with this organization's certificates. Built from official unsigned artifacts of https://github.com/lanternops/breeze/releases/tag/v${VERSION}, verified against the official Ed25519 release manifest before signing."

      - name: Delete temporary staging release
        if: success() && inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_TAG: ${{ needs.staging.outputs.tag }}
        run: |
          set -euo pipefail

          # Delete the temporary draft release first. Do not use --cleanup-tag
          # here because GitHub may already have removed the underlying ref,
          # which can otherwise return HTTP 422 and turn a successful publish red.
          if gh release view "$STAGING_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$STAGING_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --yes
          else
            echo "Staging release $STAGING_TAG is already absent."
          fi

          # Delete the staging tag only if it still exists. A missing tag is fine.
          git_ref="tags/${STAGING_TAG}"
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/${git_ref}")"

          case "$status" in
            200)
              gh api \
                --method DELETE \
                "repos/${GITHUB_REPOSITORY}/git/refs/${git_ref}"
              echo "Deleted staging tag $STAGING_TAG."
              ;;
            404)
              echo "Staging tag $STAGING_TAG is already absent."
              ;;
            *)
              echo "::warning::Could not determine whether staging tag still exists (HTTP ${status}); the canonical release has already been published successfully."
              ;;
          esac

      - name: Write instance configuration summary
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          pubkey="$(cat derived-public-key.txt)"
          {
            echo "## Point your Breeze instance at this release"
            echo ""
            if [ "$DRY_RUN" = "true" ]; then
              echo "> **Dry run** — no public/canonical release was published. The binaries produced are **unsigned** and the key below is a throwaway generated in this run: your real manifest key was never loaded. The temporary draft staging release is for workflow transport/debugging only and must not be used as a production release. Real runs print your real key here."
              echo ""
            fi
            echo '```bash'
            echo "BINARY_SOURCE=github"
            echo "BINARY_GITHUB_REPOSITORY=${GITHUB_REPOSITORY}"
            echo "BINARY_VERSION=${VERSION}"
            echo "RELEASE_ARTIFACT_MANIFEST_PUBLIC_KEYS=${pubkey}"
            echo "AGENT_AUTO_PROMOTE=false   # recommended: promote explicitly after verifying sync"
            echo '```'
            echo ""
            echo "Map each variable in your compose file's \`api\` service \`environment:\` block — a value in \`.env\` alone never reaches the container. Full walkthrough: the \"Sign Your Own Agent Packages\" guide in the Breeze docs."
          } >> "$GITHUB_STEP_SUMMARY"
